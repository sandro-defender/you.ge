<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>You.Ge - Welcome</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    
    <link rel="icon" href="/img/icon/icon.png" type="image/png">
    <link rel="apple-touch-icon-precomposed" href="/img/icon/icon.png">
    <link rel="apple-touch-icon" sizes="256x256" href="/img/icon/icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icon/icon.png">
    
    <meta content="/img/icon/icon.png" name="msapplication-TileImage">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Iveria Staff">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    
    <link rel="apple-touch-startup-image" href="/img/icon/icon.png">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Animated gradient background */
        .gradient-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #4facfe);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            opacity: 0.1;
            z-index: 0;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Mesh gradient overlay */
        .mesh-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(at 20% 30%, rgba(102, 126, 234, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 70%, rgba(118, 75, 162, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(240, 147, 251, 0.1) 0px, transparent 50%);
            filter: blur(40px);
            z-index: 0;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 80px 60px;
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            max-width: 700px;
            z-index: 2;
            position: relative;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            animation: containerAppear 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(40px);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }

        .flag-container {
            position: relative;
            margin: 0 auto 50px;
            width: 160px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flag-glow {
            position: absolute;
            width: 180px;
            height: 140px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.3), transparent 70%);
            filter: blur(30px);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        .flag {
            width: 160px;
            height: 120px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 15px 45px rgba(220, 38, 38, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.3);
            animation: flagHover 4s ease-in-out infinite;
            position: relative;
            z-index: 1;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .flag img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes flagHover {
            0%, 100% {
                transform: translateY(0) rotateY(0);
            }
            25% {
                transform: translateY(-8px) rotateY(-3deg);
            }
            50% {
                transform: translateY(0) rotateY(0);
            }
            75% {
                transform: translateY(-8px) rotateY(3deg);
            }
        }

        .title {
            font-size: 4em;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #667eea 50%, #764ba2 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGradient 4s ease infinite;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        @keyframes titleGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .subtitle {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 40px;
            animation: subtitleFade 2s ease-in-out infinite;
        }

        @keyframes subtitleFade {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .message {
            font-size: 1.4em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 400;
        }

        .message-highlight {
            color: #667eea;
            font-weight: 600;
        }

        .loader-section {
            margin: 60px auto 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .orbs-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            height: 60px;
        }

        .orb {
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            animation: orbBounce 1.4s ease-in-out infinite;
            box-shadow: 0 0 25px rgba(102, 126, 234, 0.8);
            position: relative;
        }

        .orb::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: inherit;
            border-radius: 50%;
            filter: blur(8px);
            opacity: 0.6;
            animation: orbGlow 1.4s ease-in-out infinite;
        }

        .orb:nth-child(1) {
            animation-delay: 0s;
        }
        .orb:nth-child(2) {
            animation-delay: 0.15s;
        }
        .orb:nth-child(3) {
            animation-delay: 0.3s;
        }
        .orb:nth-child(4) {
            animation-delay: 0.45s;
        }
        .orb:nth-child(5) {
            animation-delay: 0.6s;
        }

        @keyframes orbBounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-20px) scale(1.2);
            }
        }

        @keyframes orbGlow {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.8;
            }
        }

        .status-text {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            animation: statusBreathe 2.5s ease-in-out infinite;
        }

        @keyframes statusBreathe {
            0%, 100% {
                opacity: 0.4;
                transform: translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        .version-badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            opacity: 0;
            animation: badgeFadeIn 1s ease-out forwards;
            animation-delay: 1.5s;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .version-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            color: rgba(255, 255, 255, 0.9);
        }

        .version-badge.showing-sw {
            background: rgba(76, 175, 80, 0.2);
            border-color: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .version-tooltip {
            position: fixed;
            bottom: 75px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 0.85rem;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            max-width: 220px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .version-tooltip.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(-5px);
        }

        .version-tooltip::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 30px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid rgba(0, 0, 0, 0.9);
        }

        @keyframes badgeFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 60px 40px;
                margin: 20px;
            }
            
            .title {
                font-size: 2.8em;
            }
            
            .message {
                font-size: 1.1em;
            }
            
            .version-badge {
                bottom: 15px;
                right: 15px;
                font-size: 0.75rem;
                padding: 8px 16px;
            }
            
            .flag-container {
                width: 140px;
                height: 100px;
            }
            
            .flag {
                width: 140px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="mesh-gradient"></div>
    <div id="particles-js"></div>

    <div class="container">
        <div class="flag-container">
            <div class="flag-glow"></div>
            <div class="flag">
                <img src="/img/svg/Flag_of_Georgia.svg" alt="Flag of Georgia">
            </div>
        </div>
        
        <div class="subtitle">Coming Soon</div>
        <h1 class="title">Under Construction</h1>
        
        <p class="message">We're crafting something <span class="message-highlight">extraordinary</span><br>Stay tuned for the launch</p>
        
        <div class="loader-section">
            <div class="orbs-container">
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
            </div>
            
            <p class="status-text">Building the future</p>
        </div>
    </div>

    <div class="version-badge" id="versionBadge">2.0</div>
    <div class="version-tooltip" id="versionTooltip"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 80,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#667eea'
                },
                shape: {
                    type: 'circle'
                },
                opacity: {
                    value: 0.3,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 1,
                        opacity_min: 0.05,
                        sync: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 2,
                        size_min: 0.1,
                        sync: false
                    }
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#667eea',
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.5,
                    direction: 'none',
                    random: true,
                    straight: false,
                    out_mode: 'out',
                    bounce: false
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: {
                        enable: true,
                        mode: 'grab'
                    },
                    onclick: {
                        enable: true,
                        mode: 'push'
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 200,
                        line_linked: {
                            opacity: 0.5
                        }
                    },
                    push: {
                        particles_nb: 4
                    }
                }
            },
            retina_detect: true
        });

        // Version Badge functionality
        (function() {
            const versionBadge = document.getElementById('versionBadge');
            const versionTooltip = document.getElementById('versionTooltip');
            const appVersion = '1.1';
            let swVersion = '...';
            
            function updateBadgeDisplay() {
                versionBadge.textContent = `v${appVersion} / SW: ${swVersion}`;
            }
            
            updateBadgeDisplay();
            
            function getServiceWorkerVersion() {
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    const messageChannel = new MessageChannel();
                    
                    messageChannel.port1.onmessage = (event) => {
                        if (event.data && event.data.type === 'SW_VERSION') {
                            swVersion = event.data.version || 'unknown';
                            updateBadgeDisplay();
                        }
                    };

                    navigator.serviceWorker.controller.postMessage(
                        { type: 'GET_SW_VERSION' },
                        [messageChannel.port2]
                    );

                    navigator.serviceWorker.controller.postMessage({ type: 'GET_SW_VERSION' });
                } else {
                    swVersion = 'none';
                    updateBadgeDisplay();
                }
            }

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(() => {
                    getServiceWorkerVersion();
                }).catch(() => {
                    setTimeout(() => {
                        getServiceWorkerVersion();
                    }, 1000);
                });
                
                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'SW_VERSION') {
                        swVersion = event.data.version || 'unknown';
                        updateBadgeDisplay();
                    }
                });
            } else {
                swVersion = 'N/A';
                updateBadgeDisplay();
            }

            versionBadge.addEventListener('click', () => {
                getServiceWorkerVersion();
                versionBadge.classList.add('showing-sw');
                
                versionTooltip.innerHTML = `
                    <div style="margin-bottom: 8px;"><strong>App:</strong> v${appVersion}</div>
                    <div><strong>Service Worker:</strong> ${swVersion}</div>
                `;
                versionTooltip.classList.add('show');
                
                setTimeout(() => {
                    versionTooltip.classList.remove('show');
                    versionBadge.classList.remove('showing-sw');
                }, 3000);
            });
        })();

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            async function checkAppVersion() {
                try {
                    const versionBadge = document.getElementById('versionBadge');
                    let currentVersion = '1.1';
                    if (versionBadge) {
                        const badgeText = versionBadge.textContent || '';
                        const versionMatch = badgeText.match(/v([\d.]+)/);
                        if (versionMatch) {
                            currentVersion = versionMatch[1];
                        }
                    }
                    const storedVersion = localStorage.getItem('app-version');
                    
                    if (storedVersion !== currentVersion) {
                        localStorage.setItem('app-version', currentVersion);
                        
                        if (storedVersion) {
                            if (confirm('ხელმისაწვდომია ახალი ვერსია. გსურთ განახლება?')) {
                                if ('caches' in window) {
                                    const cacheNames = await caches.keys();
                                    await Promise.all(
                                        cacheNames.map(name => caches.delete(name))
                                    );
                                }
                                window.location.reload(true);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error checking version:', error);
                }
            }

            window.addEventListener('load', function() {
                checkAppVersion();
                
                navigator.serviceWorker.register('/workbox-service-worker.js', {
                    updateViaCache: 'none'
                })
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                        
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    if (confirm('ხელმისაწვდომია ახალი ვერსია. გსურთ განახლება?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });

                        if (navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' });
                        } else {
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' });
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });

                navigator.serviceWorker.addEventListener('message', event => {
                    if (event.data && event.data.version) {
                        console.log('Service Worker version:', event.data.version);
                    }
                });
            });
        }
    </script>
</body>
</html>
