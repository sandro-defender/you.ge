<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: float 15s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-form h2 {
            font-size: 32px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 12px;
            text-align: center;
        }

        .login-form p.subtitle {
            color: #718096;
            text-align: center;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: white;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #e53e3e;
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            padding: 12px;
            background: #fff5f5;
            border-radius: 8px;
            border-left: 4px solid #e53e3e;
            animation: shake 0.4s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .admin-content {
            display: none;
        }

        .admin-content h1 {
            font-size: 36px;
            font-weight: 800;
            color: #1a202c;
            margin-bottom: 12px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-text {
            color: #718096;
            text-align: center;
            margin-bottom: 32px;
            font-size: 16px;
        }

        .projects-section {
            margin: 32px 0;
        }

        .projects-section h3 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .project-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .project-link {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: linear-gradient(135deg, #f7fafc 0%, #edf2f7 100%);
            border-radius: 12px;
            text-decoration: none;
            color: #2d3748;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .project-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .project-link:hover::before {
            transform: scaleY(1);
        }

        .project-link:hover {
            transform: translateX(8px);
            background: linear-gradient(135deg, #edf2f7 0%, #e2e8f0 100%);
        }

        .project-link::after {
            content: '→';
            margin-left: auto;
            font-size: 18px;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
        }

        .project-link:hover::after {
            opacity: 1;
            transform: translateX(0);
        }

        .logout-btn {
            margin-top: 32px;
            background: linear-gradient(135deg, #fc8181 0%, #f56565 100%);
        }

        .logout-btn:hover {
            box-shadow: 0 10px 25px rgba(245, 101, 101, 0.4);
        }

        /* Loading state */
        button.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        button.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 24px;
            }

            .login-form h2,
            .admin-content h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card login-form" id="loginForm">
            <h2>Admin Login</h2>
            <p class="subtitle">Enter your password to continue</p>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
            </div>
            <button onclick="login()" id="loginBtn">Sign In</button>
            <p class="error" id="error" style="display: none;"></p>
        </div>

        <div class="card admin-content" id="adminContent">
            <h1>Admin Panel</h1>
            <p class="welcome-text">Welcome back! You are authenticated.</p>

            <div class="projects-section">
                <h3>Current Projects</h3>
                <div class="project-links">
                    <a href="https://live.you.ge" class="project-link" target="_blank">live.you.ge</a>
                    <a href="https://tips.you.ge" class="project-link" target="_blank">tips.you.ge</a>
                </div>
            </div>

            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <script>
        // Check if already authenticated
        async function checkAuth() {
            try {
                const response = await fetch('/api/auth', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (!response.ok) {
                    console.error('Auth check failed:', response.status);
                    return;
                }

                const data = await response.json();

                if (data.authenticated) {
                    showAdminContent();
                }
            } catch (error) {
                console.error('Auth check error:', error);
            }
        }

        // Login function
        async function login() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const loginBtn = document.getElementById('loginBtn');
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            if (!password) {
                errorDiv.textContent = 'Please enter a password';
                errorDiv.style.display = 'block';
                return;
            }

            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.textContent = '';

            try {
                const response = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ password })
                });

                // Remove loading state
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'Sign In';

                // Handle 403 Forbidden (wrong password) - redirect to main page
                if (response.status === 403) {
                    window.location.href = '/';
                    return;
                }

                if (!response.ok) {
                    window.location.href = '/';
                    return;
                }

                const data = await response.json();

                if (data.success) {
                    showAdminContent();
                    document.getElementById('password').value = '';
                } else {
                    window.location.href = '/';
                }
            } catch (error) {
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'Sign In';
                console.error('Login error:', error);
                window.location.href = '/';
            }
        }

        // Logout function
        async function logout() {
            try {
                const response = await fetch('/api/logout', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.ok) {
                    // Hide admin content and show login form
                    document.getElementById('adminContent').style.display = 'none';
                    document.getElementById('loginForm').style.display = 'block';
                    document.getElementById('password').value = '';
                    document.getElementById('error').style.display = 'none';
                }
            } catch (error) {
                console.error('Logout error:', error);
                location.reload();
            }
        }

        // Show admin content
        function showAdminContent() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
        }

        // Enter key to login
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        // Check auth on page load
        checkAuth();
    </script>
</body>

</html>
