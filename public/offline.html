<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0914" />
    <title>Offline — you.ge</title>
    <style>
      :root{color-scheme:dark;--bg:#060711;--panel:#101528;--text:#f4f6ff;--muted:#9da7c8;--accent:#8b7bff}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,rgba(139,123,255,.18),transparent 32%),linear-gradient(180deg,#060711,#090c17);font:16px/1.6 Inter,system-ui,sans-serif;color:var(--text);padding:24px}
      main{max-width:34rem;width:min(100%,34rem);background:rgba(16,21,40,.92);border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:28px;box-shadow:0 24px 70px rgba(4,6,14,.45)}
      .pill{display:inline-flex;padding:.35rem .8rem;border-radius:999px;border:1px solid rgba(139,123,255,.4);background:rgba(139,123,255,.14);font-weight:700;font-size:.8rem;color:#d9d4ff}
      h1{font-size:clamp(2rem,7vw,3rem);line-height:1.05;margin:.9rem 0}.muted{color:var(--muted)}
      a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:.75rem 1rem;border-radius:999px;background:linear-gradient(135deg,#8b7bff,#6d5cff);color:#fff;text-decoration:none;font-weight:700;margin-top:1rem}
    </style>
  </head>
  <body>
    <main>
      <span class="pill">Offline mode</span>
      <h1>The premium shell is cached, but this page needs a connection.</h1>
      <p class="muted">Reconnect to access protected pages, live sync data, and authenticated admin tools. Static assets and the public shell are already ready to return instantly.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
