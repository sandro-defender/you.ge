<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You.Ge - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            overflow: hidden;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            height: 100vh;
            position: relative;
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
        }

        .logo-container {
            animation: float 3s ease-in-out infinite;
        }

        .logo {
            font-size: 4rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .welcome-text {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 0.5s;
        }

        .description {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1s;
        }

        .cta-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 1.5s;
        }

        .cta-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .secondary-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 100%;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .secondary-content.active {
            opacity: 1;
            visibility: visible;
        }

        .secondary-content h2 {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .secondary-content p {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 1rem;
        }

        .back-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 2rem;
            display: inline-block;
            text-decoration: none;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
        }

        .container.fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        .georgia-flag {
            font-size: 5rem;
            margin-bottom: 1rem;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96f2d7);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
            }
            .welcome-text {
                font-size: 2rem;
            }
            .description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="georgia-flag">🇬🇪</div>
            <h1 class="logo">You.Ge</h1>
        </div>
        <h2 class="welcome-text">Welcome to You.Ge</h2>
        <p class="description">Under Construction</p>
        <p class="description">Please check back soon!</p>
        <button class="cta-button">Explore Now</button>
    </div>

    <div class="secondary-content">
        <h2>You.Ge™</h2>
        <p>Thank you for visiting!</p>
        <p>We're working on something amazing.</p>
        <button class="back-button" onclick="location.reload()">Go Back</button>
    </div>

    <script>
        // Button click handler - fade out welcome screen and show secondary content
        document.querySelector('.cta-button').addEventListener('click', function() {
            const container = document.querySelector('.container');
            const secondaryContent = document.querySelector('.secondary-content');
            
            // Fade out the welcome container
            container.classList.add('fade-out');
            
            // Show secondary content after fade out animation
            setTimeout(() => {
                container.style.display = 'none';
                secondaryContent.classList.add('active');
            }, 500);
        });
    </script>
</body>
</html>
