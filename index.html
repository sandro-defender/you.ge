 <style>
 * {
 margin: 0;
 padding: 0;
 box-sizing: border-box;
 font-family: 'Arial', sans-serif;
 }

 body {
 overflow: hidden;
 background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
 height: 100vh;
 position: relative;
 }

 .container {
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 text-align: center;
 width: 100%;
 }

 .logo-container {
 animation: float 3s ease-in-out infinite;
 }

 .logo {
 font-size: 4rem;
 color: white;
 text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
 margin-bottom: 2rem;
 }

 .welcome-text {
 font-size: 2.5rem;
 color: white;
 margin-bottom: 1.5rem;
 opacity: 0;
 animation: fadeIn 1s ease-out forwards;
 animation-delay: 0.5s;
 }

 .description {
 font-size: 1.2rem;
 color: rgba(255, 255, 255, 0.9);
 margin-bottom: 2rem;
 opacity: 0;
 animation: fadeIn 1s ease-out forwards;
 animation-delay: 1s;
 }

 .cta-button {
 padding: 15px 40px;
 font-size: 1.2rem;
 background: rgba(255, 255, 255, 0.2);
 border: 2px solid white;
 color: white;
 border-radius: 30px;
 cursor: pointer;
 transition: all 0.3s ease;
 opacity: 0;
 animation: fadeIn 1s ease-out forwards;
 animation-delay: 1.5s;
 }

 .cta-button:hover {
 background: rgba(255, 255, 255, 0.3);
 transform: scale(1.05);
 }

 .links-container {
 position: absolute;
 top: 50%;
 left: 50%;
 transform: translate(-50%, -50%);
 text-align: center;
 opacity: 0;
 visibility: hidden;
 transition: all 0.5s ease;
 }

 .links-container.active {
 opacity: 1;
 visibility: visible;
 }

 .links-container a {
 color: white;
 text-decoration: none;
 font-size: 1.5rem;
 margin: 0 1.5rem;
 padding: 10px 20px;
 border-radius: 25px;
 transition: all 0.3s ease;
 display: inline-block;
 position: relative;
 opacity: 0;
 transform: translateY(20px);
 }

 .links-container.active a {
 opacity: 1;
 transform: translateY(0);
 animation: linkFadeIn 0.5s ease-out forwards;
 }

 .links-container a:hover {
 background: rgba(255, 255, 255, 0.2);
 transform: scale(1.1);
 }

 .links-container a::after {
 content: '';
 position: absolute;
 right: -1.8rem;
 color: white;
 pointer-events: none;
 }

 .links-container a:last-child::after {
 display: none;
 }

 @keyframes float {
 0% { transform: translateY(0px); }
 50% { transform: translateY(-20px); }
 100% { transform: translateY(0px); }
 }

 @keyframes fadeIn {
 from {
 opacity: 0;
 transform: translateY(20px);
 }
 to {
 opacity: 1;
 transform: translateY(0);
 }
 }

 @keyframes linkFadeIn {
 from {
 opacity: 0;
 transform: translateY(20px);
 }
 to {
 opacity: 1;
 transform: translateY(0);
 }
 }

 .georgia-flag {
 font-size: 5rem;
 margin-bottom: 1rem;
 display: inline-block;
 animation: pulse 2s infinite;
 }

 @keyframes pulse {
 0% { transform: scale(1); }
 50% { transform: scale(1.1); }
 100% { transform: scale(1); }
 }

 body::before {
 content: '';
 position: absolute;
 width: 200%;
 height: 200%;
 background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96f2d7);
 animation: rotate 20s linear infinite;
 z-index: -1;
 }

 @keyframes rotate {
 0% { transform: rotate(0deg); }
 100% { transform: rotate(360deg); }
 }

 @media (max-width: 768px) {
 .logo {
 font-size: 3rem;
 }
 .welcome-text {
 font-size: 2rem;
 }
 .description {
 font-size: 1rem;
 }
 .links-container a {
 font-size: 1.2rem;
 margin: 0 1rem;
 }
 }
 </style>
