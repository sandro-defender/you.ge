<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>You.Ge - Welcome</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  <!-- , viewport-fit=cover"> (for fullscreen) -->
    <meta name="theme-color" content="#000000">
    
    <link rel="icon" href="/img/icon/icon.png" type="image/png">   <!--ios app image only! -->
    <link rel="apple-touch-icon-precomposed" href="/img/icon/icon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/img/icon/icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icon/icon.png">
    
    <!--for windows--> 
    <meta content="/img/icon/icon.png" name="msapplication-TileImage">
    
    <!-- ios meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Iveria Staff">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    
    
    <!-- ios splash screens -->
    <link rel="apple-touch-startup-image" href="/img/icon/icon.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 30, 0.25);
            padding: 60px 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1),
                        0 0 100px rgba(102, 126, 234, 0.15);
            max-width: 600px;
            z-index: 1;
            animation: fadeInScale 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .flag-container {
            perspective: 1000px;
            margin: 0 auto 40px;
            width: 140px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flag {
            width: 140px;
            height: 100px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 0, 0, 0.3);
            animation: flagFloat 4s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .flag img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes flagFloat {
            0%, 100% {
                transform: translateY(0px) rotateY(0deg);
            }
            25% {
                transform: translateY(-10px) rotateY(-5deg);
            }
            50% {
                transform: translateY(0px) rotateY(0deg);
            }
            75% {
                transform: translateY(-10px) rotateY(5deg);
            }
        }

        .title {
            font-size: 3em;
            color: #fff;
            margin-bottom: 30px;
            font-weight: bold;
            background: linear-gradient(45deg, #667eea, #764ba2, #667eea);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        @keyframes gradientShift {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .message {
            font-size: 1.3em;
            color: #b8b8b8;
            margin-bottom: 15px;
            line-height: 1.8;
            animation: messageFloat 2.5s ease-in-out infinite;
        }

        @keyframes messageFloat {
            0%, 100% {
                transform: translateY(0);
                opacity: 0.9;
            }
            50% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        .spinner-container {
            margin: 50px auto 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .orbs {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            height: 50px;
        }

        .orb {
            width: 12px;
            height: 12px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            animation: orbPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
        }

        .orb:nth-child(1) {
            animation-delay: 0s;
        }

        .orb:nth-child(2) {
            animation-delay: 0.2s;
        }

        .orb:nth-child(3) {
            animation-delay: 0.4s;
        }

        .orb:nth-child(4) {
            animation-delay: 0.6s;
        }

        .orb:nth-child(5) {
            animation-delay: 0.8s;
        }

        @keyframes orbPulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.8);
                opacity: 1;
            }
        }

        .status-text {
            font-size: 0.95em;
            color: #888;
            margin-top: 25px;
            animation: statusPulse 2s ease-in-out infinite;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes statusPulse {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        .glow-effect {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.3), transparent);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.1;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }
            .title {
                font-size: 2.2em;
            }
        }

        .version-badge {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
            animation-delay: 2s;
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .version-badge:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.05);
        }

        .version-badge.showing-sw {
            background: rgba(76, 175, 80, 0.8);
        }

        .version-tooltip {
            position: fixed;
            bottom: 60px;
            right: 15px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.8rem;
            z-index: 1001;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 200px;
        }

        .version-tooltip.show {
            opacity: 1;
            visibility: visible;
        }

        .version-tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 20px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(0, 0, 0, 0.9);
        }

        .version-badge::before {
            content: '';
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            .version-badge {
                bottom: 10px;
                right: 10px;
                font-size: 0.75rem;
                padding: 6px 12px;
            }
        }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="glow-effect"></div>

    <div class="container">
        <div class="flag-container">
            <div class="flag">
                <img src="/img/svg/Flag_of_Georgia.svg" alt="Flag of Georgia">
            </div>
        </div>
        
        <h1 class="title">Under Construction</h1>
        
        <p class="message">Thank you for visiting!<br>We're working on something amazing.</p>
        
        <div class="spinner-container">
            <div class="orbs">
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
                <div class="orb"></div>
            </div>
        </div>
        
        <p class="status-text">Building the future</p>
    </div>

    <!-- Version Badge -->
    <div class="version-badge" id="versionBadge">2.0</div>
    <div class="version-tooltip" id="versionTooltip"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: {
                    value: 100,
                    density: {
                        enable: true,
                        value_area: 800
                    }
                },
                color: {
                    value: '#667eea'
                },
                shape: {
                    type: 'circle',
                    stroke: {
                        width: 0,
                        color: '#000000'
                    }
                },
                opacity: {
                    value: 0.4,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 1,
                        opacity_min: 0.1,
                        sync: false
                    }
                },
                size: {
                    value: 3,
                    random: true,
                    anim: {
                        enable: true,
                        speed: 2,
                        size_min: 0.1,
                        sync: false
                    }
                },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#667eea',
                    opacity: 0.3,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'out',
                    bounce: false,
                    attract: {
                        enable: true,
                        rotateX: 600,
                        rotateY: 1200
                    }
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: {
                        enable: true,
                        mode: 'grab'
                    },
                    onclick: {
                        enable: true,
                        mode: 'push'
                    },
                    resize: true
                },
                modes: {
                    grab: {
                        distance: 200,
                        line_linked: {
                            opacity: 0.8
                        }
                    },
                    push: {
                        particles_nb: 4
                    }
                }
            },
            retina_detect: true
        });

        // Version Badge - App version defined inline
        (function() {
            const versionBadge = document.getElementById('versionBadge');
            const versionTooltip = document.getElementById('versionTooltip');
            // App version defined inline in page code
            const appVersion = '1.1';
            let swVersion = '...';
            
            // Function to update badge display
            function updateBadgeDisplay() {
                versionBadge.textContent = `v${appVersion} / SW: ${swVersion}`;
            }
            
            // Initialize badge with app version
            updateBadgeDisplay();
            
            // Function to get service worker version
            function getServiceWorkerVersion() {
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    // Request version from service worker
                    const messageChannel = new MessageChannel();
                    
                    messageChannel.port1.onmessage = (event) => {
                        if (event.data && event.data.type === 'SW_VERSION') {
                            swVersion = event.data.version || 'unknown';
                            updateBadgeDisplay();
                        }
                    };

                    navigator.serviceWorker.controller.postMessage(
                        { type: 'GET_SW_VERSION' },
                        [messageChannel.port2]
                    );

                    // Fallback: try direct message
                    navigator.serviceWorker.controller.postMessage({ type: 'GET_SW_VERSION' });
                } else {
                    swVersion = 'none';
                    updateBadgeDisplay();
                }
            }

            // Get service worker version on load
            if ('serviceWorker' in navigator) {
                // Wait for service worker to be ready
                navigator.serviceWorker.ready.then(() => {
                    getServiceWorkerVersion();
                }).catch(() => {
                    // If service worker not ready, try after a delay
                    setTimeout(() => {
                        getServiceWorkerVersion();
                    }, 1000);
                });
                
                // Listen for service worker messages
                navigator.serviceWorker.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'SW_VERSION') {
                        swVersion = event.data.version || 'unknown';
                        updateBadgeDisplay();
                    }
                });
            } else {
                swVersion = 'N/A';
                updateBadgeDisplay();
            }

            // Click handler to refresh service worker version
            versionBadge.addEventListener('click', () => {
                getServiceWorkerVersion();
                versionBadge.classList.add('showing-sw');
                
                // Show tooltip with detailed info
                versionTooltip.innerHTML = `
                    <div style="margin-bottom: 6px;"><strong>App:</strong> v${appVersion}</div>
                    <div><strong>Service Worker:</strong> ${swVersion}</div>
                `;
                versionTooltip.classList.add('show');
                
                // Hide after 3 seconds
                setTimeout(() => {
                    versionTooltip.classList.remove('show');
                    versionBadge.classList.remove('showing-sw');
                }, 3000);
            });
        })();

        // Early Service Worker Registration and Version Check
        if ('serviceWorker' in navigator) {
            // Check app version (using inline version from version badge code)
            async function checkAppVersion() {
                try {
                    // Get version from version badge (defined above)
                    const versionBadge = document.getElementById('versionBadge');
                    let currentVersion = '1.1'; // Default fallback
                    if (versionBadge) {
                        // Extract version from badge text (format: "v1.1 / SW: ...")
                        const badgeText = versionBadge.textContent || '';
                        const versionMatch = badgeText.match(/v([\d.]+)/);
                        if (versionMatch) {
                            currentVersion = versionMatch[1];
                        }
                    }
                    const storedVersion = localStorage.getItem('app-version');
                    
                    // If version changed or this is first installation
                    if (storedVersion !== currentVersion) {
                        // Update version in localStorage
                        localStorage.setItem('app-version', currentVersion);
                        
                        // If this is not the first installation, show notification
                        if (storedVersion) {
                            if (confirm('ხელმისაწვდომია ახალი ვერსია. გსურთ განახლება?')) {
                                // Clear cache and reload page
                                if ('caches' in window) {
                                    const cacheNames = await caches.keys();
                                    await Promise.all(
                                        cacheNames.map(name => caches.delete(name))
                                    );
                                }
                                window.location.reload(true);
                            }
                        }
                    }
                } catch (error) {
                    console.error('Error checking version:', error);
                }
            }

            window.addEventListener('load', function() {
                // Check version on load
                checkAppVersion();
                
                // Register Service Worker with updateViaCache: 'none' to always check for updates
                navigator.serviceWorker.register('/workbox-service-worker.js', {
                    updateViaCache: 'none'
                })
                    .then(registration => {
                        console.log('Service Worker registered:', registration);
                        
                        // Check for Service Worker updates
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // Show update notification
                                    if (confirm('ხელმისაწვდომია ახალი ვერსია. გსურთ განახლება?')) {
                                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                                        window.location.reload();
                                    }
                                }
                            });
                        });

                        // Handle Service Worker version
                        if (navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' });
                        } else {
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                navigator.serviceWorker.controller.postMessage({ type: 'GET_VERSION' });
                            });
                        }
                    })
                    .catch(error => {
                        console.error('Service Worker registration failed:', error);
                    });

                // Handle messages from Service Worker (version info goes to version badge)
                navigator.serviceWorker.addEventListener('message', event => {
                    if (event.data && event.data.version) {
                        // Version badge will handle this via its own message listener
                        console.log('Service Worker version:', event.data.version);
                    }
                });
            });
        }
    </script>
</body>
</html>
